AWSTemplateFormatVersion: "2010-09-09"
Description: Least-privilege Trace QMS validation integration secret access for the application task role

Parameters:
  ApplicationTaskRoleArn:
    Type: String
    AllowedPattern: "arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/.+"
  EncryptionKeyArn:
    Type: String
    AllowedPattern: "arn:aws[a-zA-Z-]*:kms:us-west-1:[0-9]{12}:key/.+"

Resources:
  IntegrationSecretReadPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: TraceQmsValidationIntegrationSecretRead
      Roles:
        - !Select [1, !Split ["/", !Ref ApplicationTaskRoleArn]]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadValidationIntegrationSecrets
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Sub arn:${AWS::Partition}:secretsmanager:us-west-1:${AWS::AccountId}:secret:trace-qms/validation/integrations/*
          - Sid: DecryptValidationIntegrationSecrets
            Effect: Allow
            Action: kms:Decrypt
            Resource: !Ref EncryptionKeyArn
            Condition:
              StringEquals:
                kms:ViaService: !Sub secretsmanager.us-west-1.${AWS::URLSuffix}

Outputs:
  IntegrationSecretNamespace:
    Value: trace-qms/validation/integrations/
  IntegrationSecretReadPolicyName:
    Value: !Ref IntegrationSecretReadPolicy
