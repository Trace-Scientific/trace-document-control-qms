name: Demo offline fixture validation

on:
  pull_request:
    paths:
      - 'fixtures/demo/**'
      - '.github/workflows/demo-fixture-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate synthetic demo fixtures without database access
        run: node fixtures/demo/validate.mjs
