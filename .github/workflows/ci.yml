name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npm run db:validate
      - run: npx prisma migrate diff --from-schema-datamodel docs/database/0001-baseline.prisma --to-schema-datamodel prisma/schema.prisma --script
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trace_qms
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
