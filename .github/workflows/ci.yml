name: CI

on:
  push:
  pull_request:

jobs:
  demo_fixture_integration:
    name: Demo fixture PostgreSQL integration
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://trace_qms_test:local_integration_test_only@127.0.0.1:5433/trace_qms_integration_test?schema=public
      RUN_DEMO_FIXTURE_INTEGRATION: "1"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trace_qms_test
          POSTGRES_PASSWORD: local_integration_test_only
          POSTGRES_DB: trace_qms_integration_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U trace_qms_test -d trace_qms_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prisma migrate deploy
      - name: Run guarded demo fixture integration tests
        run: npx vitest run src/lib/documents/demo-fixture-postgres.integration.test.ts
      - name: Verify competency transactions and requirement coverage
        run: npx vitest run src/lib/training/competency-postgres.integration.test.ts src/lib/training/competency-requirements-postgres.integration.test.ts
      - name: Verify CAPA worklist and tenant isolation
        run: npx vitest run src/lib/quality/capa-worklist-postgres.integration.test.ts

  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trace_qms
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trace_qms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trace_qms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release metadata consistency
        run: |
          node -e "const p=require('./package.json'),l=require('./package-lock.json'); if(p.version!==l.version||p.version!==l.packages?.['']?.version) throw new Error('Release version mismatch: package='+p.version+', lock='+l.version+', root='+l.packages?.['']?.version)"
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run db:validate
      - run: npx prisma migrate deploy
      - run: npx prisma db execute --file prisma/tests/integrity.sql --schema prisma/schema.prisma
      - name: Seed the synthetic document and private-file recovery fixtures
        run: |
          recovery_password="$(node -p 'require("node:crypto").randomBytes(24).toString("base64url")')"
          echo "::add-mask::$recovery_password"
          file_fixture="$RUNNER_TEMP/trace-qms-recovery-fixture.txt"
          printf '%s\n' 'Synthetic Trace QMS controlled file for recovery verification.' > "$file_fixture"
          second_fixture="$RUNNER_TEMP/trace-qms-recovery-fixture-2.txt"
          printf '%s\n' 'A second, distinct synthetic Trace QMS recovery file.' > "$second_fixture"
          RESTORE_FILE_FIXTURE_PATH="$file_fixture" RESTORE_SECOND_FILE_FIXTURE_PATH="$second_fixture" \
            RESTORE_DEMO_PASSWORD="$recovery_password" \
            node --experimental-strip-types scripts/seed-demo-recovery-ci-fixture.mjs
          printf 'RESTORE_DEMO_PASSWORD=%s\n' "$recovery_password" >> "$GITHUB_ENV"
      - name: Verify database backup and restore
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/trace_qms_restore
        run: |
          docker run --rm --network host \
            --env PGPASSWORD=postgres postgres:17-alpine \
            pg_dump --host 127.0.0.1 --username postgres --dbname trace_qms \
            --format custom > /tmp/trace-qms.dump
          docker run --rm --network host \
            --env PGPASSWORD=postgres postgres:17-alpine \
            createdb --host 127.0.0.1 --username postgres trace_qms_restore
          docker run --rm --network host \
            --env PGPASSWORD=postgres \
            --volume /tmp/trace-qms.dump:/tmp/trace-qms.dump:ro \
            postgres:17-alpine pg_restore --host 127.0.0.1 \
            --username postgres --dbname trace_qms_restore --exit-on-error \
            /tmp/trace-qms.dump
          npx prisma migrate deploy
          npx prisma db execute --file prisma/tests/integrity.sql --schema prisma/schema.prisma
      - name: Verify offline demo backup worker
        run: bash scripts/demo-backup-worker-ci.sh
      - name: Verify commercial proposal transactions in isolated PostgreSQL
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U postgres trace_qms_integration_test
          TRACE_QMS_INTEGRATION_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/trace_qms_integration_test \
            DATABASE_URL=postgresql://postgres:postgres@localhost:5432/trace_qms_integration_test \
            npx prisma migrate deploy
          TRACE_QMS_INTEGRATION_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/trace_qms_integration_test \
            node --test scripts/trace-qms-proposal-postgres.integration.node-test.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: python3 scripts/railway-demo-file-scanner-test.py
      - name: Verify training certificate PDF output
        run: |
          if ! command -v pdftotext >/dev/null || ! command -v pdfinfo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          export TRACE_QMS_CERTIFICATE_PRINT_CHROME="$(command -v google-chrome)"
          test -x "$TRACE_QMS_CERTIFICATE_PRINT_CHROME"
          npx vitest run src/app/api/training/my-completion-certificate/route.test.ts -t "prints the training certificate"
      - run: npm run test:validation-config
      - run: npm run test:aws-validation-template
      - run: npm run test:aws-service-template
      - run: npm run test:aws-migration-contract
      - run: npm run test:aws-deployment-control
      - run: npm run test:aws-foundation-control
      - run: npm run test:railway-preview
      - run: npm run build
      - name: Build production container
        run: |
          docker build \
            --build-arg APP_RELEASE_VERSION="$(node -p "require('./package.json').version")" \
            --build-arg APP_RELEASE_SHA="${{ github.sha }}" \
            --tag trace-document-control-qms:${{ github.sha }} .
      - name: Verify private restore inventory validation
        run: node --test scripts/demo-private-restore.node-test.mjs
      - name: Verify the Railway restore worker with a disposable archive
        run: bash scripts/demo-restore-worker-ci.sh
      - name: Build Railway preview container
        run: |
          docker build \
            --file Dockerfile.preview \
            --tag trace-document-control-qms-preview:${{ github.sha }} .
      - name: Build private-network migration container
        run: |
          docker build \
            --target migration \
            --build-arg APP_RELEASE_VERSION="$(node -p "require('./package.json').version")" \
            --build-arg APP_RELEASE_SHA="${{ github.sha }}" \
            --tag trace-document-control-qms-migration:${{ github.sha }} .
      - name: Run production smoke checks on the restored database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/trace_qms_restore
          APP_RELEASE_VERSION: 0.1.0-rc.9
          APP_RELEASE_SHA: ${{ github.sha }}
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/qms-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/qms-next.log
              exit 1
            fi
            sleep 1
          done
          curl --fail-with-body --silent --show-error \
            http://127.0.0.1:3000/api/health/readiness
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:3000/api/documents)
          test "$status" = "401"
