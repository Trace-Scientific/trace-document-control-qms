name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trace_qms
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trace_qms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trace_qms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run db:validate
      - run: npx prisma migrate deploy
      - run: npx prisma db execute --file prisma/tests/integrity.sql --schema prisma/schema.prisma
      - name: Verify database backup and restore
        run: |
          docker run --rm --network host \
            --env PGPASSWORD=postgres postgres:17-alpine \
            pg_dump --host 127.0.0.1 --username postgres --dbname trace_qms \
            --format custom > /tmp/trace-qms.dump
          docker run --rm --network host \
            --env PGPASSWORD=postgres postgres:17-alpine \
            createdb --host 127.0.0.1 --username postgres trace_qms_restore
          docker run --rm --network host \
            --env PGPASSWORD=postgres \
            --volume /tmp/trace-qms.dump:/tmp/trace-qms.dump:ro \
            postgres:17-alpine pg_restore --host 127.0.0.1 \
            --username postgres --dbname trace_qms_restore --exit-on-error \
            /tmp/trace-qms.dump
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/trace_qms_restore \
            npx prisma db execute --file prisma/tests/integrity.sql --schema prisma/schema.prisma
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:validation-config
      - run: npm run build
      - name: Build production container
        run: |
          docker build \
            --build-arg APP_RELEASE_VERSION="$(node -p "require('./package.json').version")" \
            --build-arg APP_RELEASE_SHA="${{ github.sha }}" \
            --tag trace-document-control-qms:${{ github.sha }} .
      - name: Run production smoke checks
        env:
          APP_RELEASE_VERSION: 0.1.0-rc.2
          APP_RELEASE_SHA: ${{ github.sha }}
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/qms-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/qms-next.log
              exit 1
            fi
            sleep 1
          done
          curl --fail-with-body --silent --show-error \
            http://127.0.0.1:3000/api/health/readiness
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:3000/api/documents)
          test "$status" = "401"
