name: Verify combined QMS preview (temporary)
on:
  pull_request:
    branches: [main]
    types: [synchronize]
permissions:
  contents: read
jobs:
  combined-preview:
    if: github.head_ref == 'codex/railway-preview-runtime-dependencies'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qms_combined_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qms_combined_smoke"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply reviewed layout and dependency drafts to the build tree
        run: |
          git restore --source=49bb18a8da3811cec7c8163567bc8b1ef03a0342 -- src/app/page.tsx src/app/sidebar-overlap-fix.css src/components/access-administration.tsx src/components/controlled-files.tsx src/components/document-control-dashboard.tsx src/components/documents-content-tabs.tsx src/components/membership-administration.tsx src/components/qms-module-shell.tsx src/components/workflow-template-administration.tsx
          git restore --source=15c98f322b5965c7f211b14262fec3bd1d36b106 -- package.json package-lock.json
      - name: Build combined preview image
        run: docker build --file Dockerfile.preview --tag qms-combined-preview .
      - name: Verify hardened image and start against disposable PostgreSQL
        run: |
          docker run --rm --entrypoint sh qms-combined-preview -ec '
            test -x node_modules/.bin/prisma
            installed=$(find ./node_modules -type d \( -path "*/node_modules/picomatch" -o -path "*/node_modules/eslint" -o -path "*/node_modules/vitest" -o -path "*/node_modules/vite" \) -print)
            test -z "$installed"
          '
          docker run --detach --name qms-combined-preview --network host \
            --env DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/qms_combined_smoke \
            --env DEPLOYMENT_TIER=development-preview --env PORT=3000 qms-combined-preview
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/api/health/readiness; then
              test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3000/api/documents)" = "401"
              test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3000/_next/image)" = "404"
              exit 0
            fi
            if test "$(docker inspect --format '{{.State.Running}}' qms-combined-preview)" != true; then exit 1; fi
            sleep 2
          done
          exit 1
      - name: Verify the permission layout with synthetic browser fixtures
        env:
          BOOTSTRAP_ORGANIZATION_CODE: qms-ci-layout
          BOOTSTRAP_ADMIN_EMAIL: layout-admin@example.com
          BOOTSTRAP_ADMIN_FIRST_NAME: CI
          BOOTSTRAP_ADMIN_LAST_NAME: Fixture
          BOOTSTRAP_ADMIN_CONFIRM: CREATE-FIRST-ADMIN
        run: |
          export BOOTSTRAP_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          docker exec qms-combined-preview node -e '
            const {PrismaClient}=require("@prisma/client");
            const db=new PrismaClient();
            db.organization.create({data:{loginCode:"qms-ci-layout",legalName:"Synthetic CI Fixture",displayName:"Synthetic CI Fixture"}}).finally(()=>db.$disconnect()).catch(error=>{console.error(error);process.exitCode=1});
          '
          docker exec --env BOOTSTRAP_ORGANIZATION_CODE --env BOOTSTRAP_ADMIN_EMAIL --env BOOTSTRAP_ADMIN_FIRST_NAME --env BOOTSTRAP_ADMIN_LAST_NAME --env BOOTSTRAP_ADMIN_CONFIRM --env BOOTSTRAP_ADMIN_PASSWORD qms-combined-preview node scripts/bootstrap-admin.mjs
          npm install --prefix "$RUNNER_TEMP/qms-browser" --no-audit --no-fund playwright-core@1.58.2
          node <<'NODE'
          const assert = require('node:assert/strict');
          const {execFileSync} = require('node:child_process');
          const {chromium} = require(process.env.RUNNER_TEMP + '/qms-browser/node_modules/playwright-core');
          (async () => {
            const executablePath = execFileSync('which', ['google-chrome'], {encoding: 'utf8'}).trim();
            const browser = await chromium.launch({executablePath, headless: true});
            try {
              const page = await browser.newPage({viewport: {width: 1440, height: 960}});
              await page.goto('http://localhost:3000/login');
              await page.locator('input[name=organizationCode]').fill(process.env.BOOTSTRAP_ORGANIZATION_CODE);
              await page.locator('input[name=email]').fill(process.env.BOOTSTRAP_ADMIN_EMAIL);
              await page.locator('input[name=password]').fill(process.env.BOOTSTRAP_ADMIN_PASSWORD);
              await page.locator('button[type=submit]').click();
              await page.getByRole('navigation', {name: 'Primary navigation'}).getByRole('button', {name: 'Administration', exact: true}).click();
              await page.getByRole('navigation', {name: 'Administration sections'}).getByRole('button', {name: 'Users & access', exact: true}).click();
              const list = page.locator('.role-permission-columns');
              await list.waitFor();
              const columnCount = () => list.locator('.role-permission-group').evaluateAll(groups => new Set(groups.map(group => Math.round(group.getBoundingClientRect().left))).size);
              assert.equal(await columnCount(), 2, 'Permission groups should form two desktop columns');
              await page.setViewportSize({width: 390, height: 844});
              assert.equal(await columnCount(), 1, 'Permission groups should form one narrow column');
              console.log('Permission layout verified at 1440px and 390px.');
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Capture startup logs and clean up
        if: always()
        run: |
          if docker inspect qms-combined-preview >/dev/null 2>&1; then
            docker logs qms-combined-preview
            docker rm --force qms-combined-preview >/dev/null
          fi
