name: Demo fixtures migrated-schema smoke

on:
  pull_request:
    paths:
      - 'fixtures/demo/**'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'
      - '.github/workflows/demo-fixture-migrated-schema.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-migrated-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trace_qms_test
          POSTGRES_PASSWORD: local_integration_test_only
          POSTGRES_DB: trace_qms_integration_test
        ports:
          - 127.0.0.1:5433:5432
        options: >-
          --health-cmd "pg_isready -U trace_qms_test -d trace_qms_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://trace_qms_test:local_integration_test_only@127.0.0.1:5433/trace_qms_integration_test?schema=public
      RUN_DEMO_FIXTURE_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: node fixtures/demo/validate.mjs
      - run: node fixtures/demo/migrated-schema-smoke.mjs
      - name: Verify actual document service, Prisma persistence and audit trail
        run: npx vitest run src/lib/documents/demo-fixture-postgres.integration.test.ts
