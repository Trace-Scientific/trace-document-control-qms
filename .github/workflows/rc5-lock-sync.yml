name: RC5 lock metadata sync

on:
  push:
    branches:
      - release-candidate-0.1.0-rc.5

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Synchronize root package-lock release metadata only
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          lock.version = '0.1.0-rc.5';
          if (!lock.packages || !lock.packages['']) throw new Error('package-lock root package metadata is missing');
          lock.packages[''].version = '0.1.0-rc.5';
          fs.writeFileSync(path, JSON.stringify(lock, null, 2) + '\n');
          NODE
          node -e "const p=require('./package.json'),l=require('./package-lock.json'); if(p.version!==l.version||p.version!==l.packages[''].version) throw new Error('Release version mismatch')"
      - name: Commit synchronized lock metadata
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock release metadata already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Release: sync package-lock metadata to rc.5'
          git push origin HEAD:${GITHUB_REF_NAME}
